name: CI

on:
  push:
    branches: [Tokenix, master]
  pull_request:
    branches: [Tokenix, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # web3==6.0.0-beta.8 needs the legacy pkg_resources API, which
          # setuptools>=81 no longer ships.
          python -m pip install "setuptools<81"
          python -m pip install -e .
          python -m pip install pytest flake8 solc-select

      - name: Install solc 0.8.19
        # used by tests/test_solgen.py to confirm generated Solidity
        # actually compiles, not just "looks" valid; skipped automatically
        # by that test if solc isn't on PATH.
        run: |
          solc-select install 0.8.19
          solc-select use 0.8.19

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Lint (report only - not a merge gate yet)
        # The inherited decompiler engine (scobelix/) has ~14k lines of
        # pre-existing flake8 findings (unused imports, E721, long lines).
        # Cleaning that up is a separate, deliberate pass - not something to
        # bundle silently into unrelated feature/hardening work. This step
        # surfaces new findings without blocking the build.
        run: python -m flake8 scobelix/ || true
