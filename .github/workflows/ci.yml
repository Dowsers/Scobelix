name: CI

on:
  push:
    branches: [Tokenix, master]
  pull_request:
    branches: [Tokenix, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # web3==6.0.0-beta.8 needs the legacy pkg_resources API, which
          # setuptools>=81 no longer ships.
          python -m pip install "setuptools<81"
          # the `verify` extra brings the EVM backends (pyrevm, py-evm) that
          # scobelix.verify's differential execution (L3) runs on
          python -m pip install -e ".[verify]"
          python -m pip install pytest flake8 solc-select

      - name: Install the solc releases the tests compile with
        # the solgen and verify tests compile the generated Solidity and
        # execute it against the original bytecode; scobelix.verify.solc
        # finds the binaries under ~/.solc-select/artifacts. 0.8.19 is the
        # compiler of most fixtures and probes; 0.8.31 (transient storage,
        # the IR pipeline of a recent release) and the pre-0.8 releases
        # (0.7.6, 0.6.12, 0.5.17, 0.4.26: older ABI coders and dispatchers)
        # build the other fixtures and probes. A test that needs a version
        # that is not installed skips itself.
        run: |
          solc-select install 0.8.19 0.8.31 0.7.6 0.6.12 0.5.17 0.4.26
          solc-select use 0.8.19

      - name: Build the signature database
        # built once from scobelix/data into ~/.cache/scobelix (30-100 s); the
        # tests then open it read-only instead of one of them paying the
        # build. A build error fails this step (the decompiler itself would
        # only go on without names, and name-checking tests would fail later)
        run: python -c "from scobelix.utils import sigdb; print(sigdb.ensure_built(sigdb.default_path()))"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run slow tests
        # long differential-execution runs (marked `slow`, excluded from the
        # default run): the other builds of the fixtures and probes, the
        # full operator and compiler grids
        run: python -m pytest tests/ -v -m slow

      - name: Lint (report only - not a merge gate yet)
        # The inherited decompiler engine (scobelix/) has ~14k lines of
        # pre-existing flake8 findings (unused imports, E721, long lines).
        # Cleaning that up is a separate, deliberate pass - not something to
        # bundle silently into unrelated feature/hardening work. This step
        # surfaces new findings without blocking the build.
        run: python -m flake8 scobelix/ || true
